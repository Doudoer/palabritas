services:
  palabritas:
    container_name: palabritas-app
    build:
      context: .
      target: production
    image: palabritas:latest
    ports:
      - "80:80"
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
